name: agentic-quality-gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run agentic quality gates
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f team/quality-gates.env ]; then
            echo "Missing team/quality-gates.env. Run scripts/init_team_config.py first." >&2
            exit 1
          fi
          set -a
          . team/quality-gates.env
          set +a
          if [ -n "${RUNTIME_SETUP_CMD:-}" ]; then
            eval "$RUNTIME_SETUP_CMD"
          fi
          ./scripts/run-quality-gates.sh ci
